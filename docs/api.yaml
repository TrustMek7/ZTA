  "components": {
    "schemas": {
      "Project": {
        "type": "object",
        "required": [
          "projectId",
          "title",
          "description",
          "goalAmountCents",
          "confirmedAmountCents",
          "status",
          "currency"
        ],
        "properties": {
          "projectId": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "goalAmountCents": {
            "type": "integer",
            "minimum": 100
          },
          "confirmedAmountCents": {
            "type": "integer",
            "minimum": 0
          },
          "status": {
            "enum": [
              "BORRADOR",
              "PUBLICADO"
            ]
          },
          "currency": {
            "const": "PEN"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "NewProject": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "title",
          "description",
          "goalAmountCents"
        ],
        "properties": {
          "title": {
            "type": "string",
            "minLength": 5,
            "maxLength": 100
          },
          "description": {
            "type": "string",
            "minLength": 30,
            "maxLength": 4000
          },
          "goalAmountCents": {
            "type": "integer",
            "minimum": 100,
            "maximum": 100000000
          }
        }
      },
      "NewDonation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "projectId",
          "amountCents"
        ],
        "properties": {
          "projectId": {
            "type": "string",
            "format": "uuid"
          },
          "amountCents": {
            "type": "integer",
            "minimum": 100,
            "maximum": 100000
          }
        }
      },
      "Donation": {
        "type": "object",
        "properties": {
          "donationId": {
            "type": "string",
